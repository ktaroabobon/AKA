openapi: 3.1.0
info:
  title: AKA-AI
  version: 0.1.0
  description: |
    AKA の LLM 応答バックエンド。GAS の bot から呼び出される。
servers:
  - url: http://localhost:8080
    description: ローカル開発
  - url: https://aka-ai-api-service-lp2rjkac3a-an.a.run.app
    description: 本番 (Cloud Run)
tags:
  - name: Health
  - name: Chat
  - name: Messages
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: ヘルスチェック
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /chat/genai:
    post:
      operationId: postChatGenai
      tags: [Chat]
      summary: Gemini に問い合わせて応答を取得する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: 応答テキスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: 不正なリクエスト or 不正な API キー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: 上流 Gemini 呼び出し失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages:
    post:
      operationId: postMessages
      tags: [Messages]
      summary: LINE のメッセージを保存する（返信先の本文を後から読むため）
      description: |
        `text` はマスク後の文字列だけが `messages/{messageId}` に 7 日間保存される。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveMessageRequest"
      responses:
        "204":
          description: 保存した
        "400":
          description: 不正なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部エラー（Firestore の失敗など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messages/{messageId}:
    get:
      operationId: getMessage
      tags: [Messages]
      summary: 保存済みメッセージがあるかだけを返す（本文は返さない）
      description: |
        bot が返信先のテキストが保存済みかを確かめ、無ければ画像を取りに行くために使う。
        期限切れ・`sessionKey` 不一致は 404。
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
          description: LINE のメッセージ ID
        - name: sessionKey
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: 同じ sessionKey の保存済みメッセージがある
        "400":
          description: 不正なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 無い（期限切れ・sessionKey 不一致を含む）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部エラー（Firestore の失敗など）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
    ChatRequest:
      type: object
      required: [sessionKey, prompt, encrypted_api_key]
      properties:
        sessionKey:
          type: string
          minLength: 1
          description: |
            会話セッションの識別子。`group:{groupId}` / `room:{roomId}` /
            `user:{userId}` のいずれかの形式で bot 側が組み立てる。
        prompt:
          type: string
          description: |
            ユーザーからの発話。`quotedMessageId` / `quotedImage` が無いときは空文字不可。
            ある場合は空文字（メンションだけ）でもよいが、返信先が見つからなければ 400。
        encrypted_api_key:
          type: string
          minLength: 1
          description: base64 でエンコードされた Gemini API キー
        quotedMessageId:
          type: string
          pattern: "^[0-9]{1,64}$"
          description: |
            返信（引用）先の LINE メッセージ ID。`POST /messages` で保存済みかつ
            同じ `sessionKey` のものだけが発話の文脈に使われる。
        quotedImage:
          type: object
          required: [mimeType, data]
          description: |
            返信（引用）先の画像。bot が LINE の取得用 API から取ったもの。
            その 1 回の応答にだけ Gemini へ渡し、保存しない（履歴には `[画像]` の印だけ）。
            これがあれば `prompt` は空文字でもよい。
          properties:
            mimeType:
              type: string
              enum: [image/jpeg, image/png, image/webp, image/heic, image/heif]
            data:
              type: string
              minLength: 1
              maxLength: 6990508
              description: base64 でエンコードした画像（5 MB を base64 にした長さが上限）
    SaveMessageRequest:
      type: object
      required: [sessionKey, messageId, sender, text]
      properties:
        sessionKey:
          type: string
          minLength: 1
          description: ChatRequest.sessionKey と同じ形式
        messageId:
          type: string
          pattern: "^[0-9]{1,64}$"
          description: LINE のメッセージ ID（数字の文字列。Firestore の doc id に使う）
        sender:
          type: string
          enum: [user, bot]
          description: 紅の発言なら bot、それ以外は user
        text:
          type: string
          minLength: 1
          maxLength: 5000
          description: メッセージの本文（LINE のテキストの上限は 5000 文字）
    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
          description: あかの応答テキスト
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: エラーコード（invalid_request / invalid_api_key / not_found / genai_failed / internal_error）
        message:
          type: string
          description: 補足メッセージ
        detail:
          description: バリデーションエラーなど構造化情報
